# Dois temas: o utilizador escolhe no menu ⋮ → Settings → Theme (Light / Dark / System).
[theme]
font = "sans-serif"
baseRadius = "medium"

[theme.light]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
borderColor = "#e2e8f0"

[theme.light.sidebar]
backgroundColor = "#f8fafc"

[theme.dark]
primaryColor = "#60a5fa"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
borderColor = "#334155"

[theme.dark.sidebar]
backgroundColor = "#111827"

[browser]
gatherUsageStats = false
